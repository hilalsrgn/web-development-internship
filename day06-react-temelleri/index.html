<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>React Temelleri</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">

    function FilmKarti(props) {
      const isim = props.isim;
      const posterYolu = props.posterYolu;

      return React.createElement(
        "div",
        { style: { border: "1px solid #ccc", padding: "10px", margin: "10px", display: "inline-block", width: "200px" } },
        React.createElement("img", {
          src: "https://image.tmdb.org/t/p/w200" + posterYolu,
          style: { width: "100%" }
        }),
        React.createElement("h3", null, isim)
      );
    }
function App() {
  const filmState = React.useState([]);
  const filmler = filmState[0];
  const setFilmler = filmState[1];

  const aramaState = React.useState("");
  const aramaMetni = aramaState[0];
  const setAramaMetni = aramaState[1];

  React.useEffect(function() {
    async function filmleriCek() {
      const apiKey = "e502a3e38116e20db08d66f4123c4961";

      let adres;
      if (aramaMetni === "") {
        adres = "https://api.themoviedb.org/3/movie/popular?api_key=" + apiKey + "&language=tr-TR";
      } else {
        adres = "https://api.themoviedb.org/3/search/movie?api_key=" + apiKey + "&language=tr-TR&query=" + aramaMetni;
      }

      const cevap = await fetch(adres);
      const veri = await cevap.json();
      setFilmler(veri.results);
    }
    filmleriCek();
  }, [aramaMetni]);

  const kartlar = filmler.map(function(film) {
    return React.createElement(FilmKarti, {
      key: film.id,
      isim: film.title,
      posterYolu: film.poster_path
    });
  });

  return React.createElement(
    "div",
    null,
    React.createElement("h1", null, "Popüler Filmler"),
    React.createElement("input", {
      type: "text",
      value: aramaMetni,
      onChange: function(event) { setAramaMetni(event.target.value); },
      placeholder: "Film ara...",
      style: { padding: "8px", marginBottom: "16px", width: "250px" }
    }),
    filmler.length === 0
      ? React.createElement("p", null, "Aradığınız filme uygun sonuç bulunamadı.")
      : kartlar
  );
}
    const kok = ReactDOM.createRoot(document.getElementById("root"));
    kok.render(React.createElement(App));

  </script>

</body>
</html>
